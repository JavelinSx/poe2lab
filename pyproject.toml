[project]
name = "poe2lab"
version = "0.1.0"
description = "Path of Exile 2 (PoE2) build analyzer on top of Path of Building: DPS and defence, gear upgrades, crafting, passive tree advice"
readme = "README.md"
license = "MIT"
keywords = ["path-of-exile-2", "poe2", "path-of-building", "build-analyzer", "build-planner", "passive-tree", "arpg"]
requires-python = ">=3.12"
dependencies = ["psutil", "fastapi", "uvicorn"]

[project.urls]
Homepage = "https://github.com/JavelinSx/poe2lab"

[tool.setuptools.packages.find]
include = ["poe2lab*"]  # pob2/, builds/, data/ sit next to the package and are not Python packages

[project.optional-dependencies]
dev = ["pytest", "httpx"]
anthropic = ["anthropic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# LuaJIT raises SEH code 0xe24c4a02 for Lua errors that PoB catches with pcall; faulthandler reports them as fatal.
addopts = "-p no:faulthandler"
