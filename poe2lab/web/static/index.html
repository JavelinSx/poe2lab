  <div class="app">
  <aside class="side">
    <a class="logo" href="/" id="logo">poe2<span>lab</span></a>
    <div class="side-head"><span data-i18n="builds"></span>
      <button id="refresh-builds" class="icon-btn sm" data-i18n-title="refresh"><svg class="ic ic-s"><use href="#i-refresh"/></svg></button></div>
    <div class="side-actions">
      <button id="new-build" class="btn btn-primary"><svg class="ic"><use href="#i-spark"/></svg><span data-i18n="nbButton"></span></button>
      <button id="add-build" class="btn btn-ghost" data-i18n-title="addBuild"><svg class="ic"><use href="#i-plus"/></svg></button>
    </div>
    <nav id="builds" class="build-list"></nav>
    <div class="side-tools">
      <button id="glossary-open" class="tool" data-i18n-title="glOpen"><svg class="ic"><use href="#i-book"/></svg><span data-i18n="glShort"></span></button>
      <button id="journal-open" class="tool" data-i18n-title="jnOpen"><svg class="ic"><use href="#i-anvil"/></svg><span data-i18n="jnShort"></span></button>
      <button id="feedback" class="tool" data-i18n-title="fbButton"><svg class="ic"><use href="#i-mail"/></svg><span data-i18n="fbShort"></span></button>
      <button id="settings-open" class="tool" data-i18n-title="setHint" aria-expanded="false"><svg class="ic"><use href="#i-gear"/></svg><span data-i18n="setShort"></span></button>
    </div>
    <div id="settings-box" class="settings-box hidden">
      <label class="league-pick small"><span class="muted" data-i18n="leagueLabel"></span>
        <select id="league"></select></label>
      <button id="ru-status" class="link small hidden"></button>
      <div id="llm-status" class="small muted"></div>
    </div>
    <div class="side-foot"><span class="ggg-notice">This product isn't affiliated with or endorsed by Grinding Gear Games in any way.</span>
      <button id="stop-app" class="icon-btn" data-i18n-title="stopHint"><svg class="ic"><use href="#i-power"/></svg></button></div>
  </aside>

  <main class="main">
    <div id="lang-banner" class="lang-banner hidden"></div>
    <header class="topbar">
      <div id="build-header" class="bh-main hidden">
        <div class="title-row"><h1 id="bh-name" class="build-name"></h1>
          <span class="bh-menu-wrap"><button id="bh-menu" class="btn btn-sm btn-quiet" aria-haspopup="menu" aria-expanded="false"><svg class="ic"><use href="#i-dots"/></svg><span id="bh-menu-label"></span></button>
            <div id="bh-menu-list" class="bh-menu-list hidden" role="menu"></div></span></div>
        <div id="bh-sub" class="who"></div>
      </div>
      <div class="controls">
