<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>poe2lab</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">poe2<span>lab</span></div>
    <div class="side-title-row"><span class="side-title" data-i18n="builds"></span>
      <button id="refresh-builds" class="icon-btn" data-i18n-title="refresh">↻</button></div>
    <button id="new-build" class="primary small" data-i18n="nbButton"></button>
    <button id="add-build" class="ghost small" data-i18n="addBuild"></button>
    <div id="builds" class="build-list"></div>
    <div class="side-foot">
      <div class="side-tiles">
        <button id="glossary-open" class="side-tile" data-i18n-title="glOpen"><span class="st-ico">📖</span><span data-i18n="glShort"></span></button>
        <button id="journal-open" class="side-tile" data-i18n-title="jnOpen"><span class="st-ico">⚒</span><span data-i18n="jnShort"></span></button>
        <button id="feedback" class="side-tile" data-i18n-title="fbButton"><span class="st-ico">✉</span><span data-i18n="fbShort"></span></button>
        <button id="settings-open" class="side-tile" data-i18n-title="setHint" aria-expanded="false"><span class="st-ico">⚙</span><span data-i18n="setShort"></span></button>
      </div>
      <div id="settings-box" class="settings-box hidden">
        <label class="league-pick small"><span class="muted" data-i18n="leagueLabel"></span>
          <select id="league"></select></label>
        <button id="ru-status" class="link small hidden"></button>
        <div id="llm-status" class="small muted"></div>
      </div>
      <button id="stop-app" class="ghost small stop-app" data-i18n="stopApp" data-i18n-title="stopHint"></button>
      <div class="ggg-notice">This product isn't affiliated with or endorsed by Grinding Gear Games in any way.</div>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div class="segmented small-seg" id="lang">
        <button data-lang="ru">RU</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
    <div id="lang-banner" class="lang-banner hidden"></div>

    <header id="build-header" class="build-header hidden">
      <div class="bh-main">
        <div class="bh-title"><h1 id="bh-name"></h1>
          <span class="bh-menu-wrap"><button id="bh-menu" class="ghost small" aria-haspopup="menu" aria-expanded="false"></button>
            <div id="bh-menu-list" class="bh-menu-list hidden" role="menu"></div></span></div>
        <div id="bh-sub" class="muted"></div>
      </div>
      <div class="bh-controls">
        <div class="field">
          <span class="field-label"><span data-i18n="mainSkill"></span> <span class="info" data-i18n-title="mainSkillHint">?</span></span>
          <div id="main-skill" class="skill-picker"></div>
        </div>
        <div class="field">
          <span class="field-label"><span data-i18n="goal"></span> <span class="info" data-i18n-title="goalHint">?</span></span>
          <div class="segmented" id="mode">
            <button data-mode="damage" data-i18n="mode_damage"></button>
            <button data-mode="balanced" class="active" data-i18n="mode_balanced"></button>
            <button data-mode="defence" data-i18n="mode_defence"></button>
          </div>
        </div>
      </div>
    </header>

    <nav id="tabs" class="tabs hidden">
      <button data-tab="overview" class="active" data-i18n="tab_overview"></button>
      <button data-tab="damage" data-i18n="tab_damage"></button>
      <button data-tab="skills" data-i18n="tab_skills"></button>
      <button data-tab="gear" data-i18n="tab_gear"></button>
      <button data-tab="tree" data-i18n="tab_tree"></button>
      <button data-tab="loot" data-i18n="tab_loot"></button>
      <button data-tab="profile" data-i18n="tab_profile"></button>
      <button data-tab="assistant" data-i18n="tab_assistant"></button>
      <span class="fold-tools">
        <button id="fold-all" class="fold-tool">⊟</button>
        <button id="unfold-all" class="fold-tool">⊞</button>
      </span>
    </nav>

    <div id="ctor-bar" class="ctor-bar hidden"></div>
    <div id="plan-strip" class="plan-strip hidden"></div>
    <div id="build-notice" class="build-notice hidden"></div>
    <div id="changes" class="hidden"></div>
    <section id="view" class="view"></section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="/static/pob_labels.js"></script>
  <script src="/static/i18n.js"></script>
  <script src="/static/treeart.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
